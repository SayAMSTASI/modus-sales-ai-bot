name: modus-sales-bot

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sales_bot}
      POSTGRES_USER: ${POSTGRES_USER:-sales_bot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the external env file}
    volumes:
      - sales_bot_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  web:
    build: .
    image: ${SALES_BOT_IMAGE:-modus-sales-bot:local}
    env_file: ${ENV_FILE:-.env.production}
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    ports:
      - "${HTTP_BIND_ADDRESS:-127.0.0.1}:${HTTP_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3).read()",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  worker:
    build: .
    image: ${SALES_BOT_IMAGE:-modus-sales-bot:local}
    env_file: ${ENV_FILE:-.env.production}
    command: python -m app.worker
    depends_on:
      db:
        condition: service_healthy
      web:
        condition: service_healthy
    restart: unless-stopped

volumes:
  sales_bot_db:
