name: modus-sales-bot-local

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sales_bot}
      POSTGRES_USER: ${POSTGRES_USER:-sales_bot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run scripts/docker-up.ps1 first}
    volumes:
      - sales_bot_local_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  bot:
    build: .
    image: modus-sales-bot:local
    env_file: ${ENV_FILE:-.env.docker.local}
    command: python -m app.local_bot
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  migrate:
    build: .
    image: modus-sales-bot:local
    env_file: ${ENV_FILE:-.env.docker.local}
    command: alembic upgrade head
    depends_on:
      db:
        condition: service_healthy

volumes:
  sales_bot_local_db:
