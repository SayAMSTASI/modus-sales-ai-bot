name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[test]"
      - run: ruff check .
      - run: pytest
      - run: python scripts/http_smoke.py
      - run: python scripts/secret_scan.py
      - run: docker build -t modus-sales-bot:test .
